# PWA版（pwa/）を GitHub Pages へ配信する。問題データは配信物に含めない。
name: GitHub Pages へ配信

on:
  push:
    branches: [main]
    paths: ["pwa/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ロジックのテスト
        run: node pwa/tests/run.js

      - name: 配信物の作成（テストは除外）
        run: |
          mkdir _site
          cp -r pwa/. _site/
          rm -rf _site/tests

      - name: 配信物の安全確認（問題データ・APIキーが含まれないこと）
        run: |
          if find _site -name "*.json" | grep -q .; then
            echo "配信物に JSON ファイルが含まれています"; exit 1
          fi
          if grep -rEq "AIza[0-9A-Za-z_-]{20,}" _site; then
            echo "配信物に APIキーらしき文字列が含まれています"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
