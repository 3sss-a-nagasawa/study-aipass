{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>模擬試験</h1>
  <ul>
    <li>全章からランダムに {{ question_count }} 問を出題します。</li>
    <li>1問ごとに回答すると、その場で正誤を判定します。</li>
    <li>回答後に前の問題へ戻って回答し直すことはできません。</li>
    <li>最後に正誤一覧と、AIによる総評を表示します。</li>
  </ul>
  {% if exam_in_progress %}
    <p><a class="button" href="{{ url_for('question') }}">受験中の試験を続ける</a></p>
  {% endif %}
  <form method="post" action="{{ url_for('index') }}">
    <button type="submit" class="button primary">
      {% if exam_in_progress %}最初から新しい試験を始める{% else %}試験を開始する{% endif %}
    </button>
  </form>
</section>
{% endblock %}
